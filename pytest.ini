[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short summary for all failures/errors
addopts =
    -ra
    --tb=short
    --strict-markers

markers =
    unit: fast, no external dependencies
    integration: requires running services (Redis, LLM)
    llm: requires a running LLM server (skip in CI with ENABLE_LLM=false)
